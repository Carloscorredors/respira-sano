95 327 L403 348" stroke-width="4"/></g></g><path class="diaphragm" d="M177 405 Q320 350 463 405" stroke="#d9f398" stroke-width="9" fill="none"/><path class="wave" id="air-path" d="M312 51 L312 178 Q312 199 269 235 L240 270 L219 300" stroke="#ddf7a3" stroke-width="4" fill="none"/><g fill="#c1d5c9" font-size="13"><text x="360" y="53">ENTRADA DEL AIRE</text><text x="352" y="130">TRÁQUEA</text><text x="473" y="252">PULMÓN</text><text x="268" y="449">DIAFRAGMA</text></g></g><g class="alveolus-view"><path d="M130 130 L266 184" fill="none" stroke="#c0dec7" stroke-width="24"/><g fill="#83b9a0" stroke="#e1efcf" stroke-width="3"><circle cx="307" cy="209" r="65"/><circle cx="395" cy="202" r="69"/><circle cx="434" cy="286" r="66"/><circle cx="357" cy="335" r="68"/><circle cx="277" cy="294" r="66"/></g><path d="M235 150 C398 100 516 195 494 318 C474 411 294 430 211 323" fill="none" stroke="#d88073" stroke-width="15"/><path class="wave" d="M290 230 L400 365" fill="none" stroke="#daf39d" stroke-width="4"/><text x="140" y="80" fill="#e7f5ed" font-size="18">Intercambio a través de una pared muy delgada</text><text x="348" y="278" fill="#123e33" font-size="22">AIRE</text><text x="492" y="389" fill="#eeb1a6" font-size="16">SANGRE</text><text x="238" y="441" fill="#daf39d" font-size="16">O₂ hacia la sangre · CO₂ hacia el alvéolo</text></g></svg>